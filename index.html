<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Music Playlist</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial, sans-serif;
}

body{
    background:#080808;
    color:white;
    min-height:100vh;
}

.header{
    padding:20px;
    text-align:center;
    background:linear-gradient(135deg,#111,#242424);
    position:sticky;
    top:0;
    z-index:10;
}

.header h1{
    font-size:26px;
}

.header p{
    color:#aaa;
    margin-top:5px;
}

.searchBox{
    padding:15px;
    display:flex;
    gap:8px;
    max-width:800px;
    margin:auto;
}

.searchBox input{
    flex:1;
    padding:13px;
    border:none;
    border-radius:10px;
    outline:none;
    font-size:15px;
}

button{
    border:none;
    cursor:pointer;
}

.loadBtn{
    padding:13px 18px;
    border-radius:10px;
    background:#00c853;
    color:white;
    font-weight:bold;
}

.container{
    max-width:900px;
    margin:auto;
    padding:10px 15px 170px;
}

.status{
    text-align:center;
    color:#aaa;
    padding:15px;
}

.song{
    display:flex;
    align-items:center;
    gap:14px;
    padding:10px;
    margin:7px 0;
    background:#151515;
    border-radius:12px;
    transition:.2s;
}

.song:hover{
    background:#222;
}

.song.active{
    background:#123d29;
}

.song img{
    width:58px;
    height:58px;
    object-fit:cover;
    border-radius:8px;
}

.songInfo{
    flex:1;
    min-width:0;
}

.songTitle{
    font-weight:bold;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.artist{
    color:#999;
    font-size:13px;
    margin-top:5px;
}

.playBtn{
    width:42px;
    height:42px;
    border-radius:50%;
    background:#00c853;
    color:white;
    font-size:18px;
}

.player{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    background:rgba(15,15,15,.97);
    border-top:1px solid #333;
    padding:12px;
    z-index:20;
}

.playerTop{
    display:flex;
    align-items:center;
    gap:12px;
    max-width:900px;
    margin:auto;
}

.playerTop img{
    width:55px;
    height:55px;
    border-radius:8px;
    object-fit:cover;
}

.nowInfo{
    flex:1;
    min-width:0;
}

.nowTitle{
    font-weight:bold;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.nowArtist{
    color:#999;
    font-size:13px;
}

.controls{
    display:flex;
    gap:8px;
}

.control{
    width:40px;
    height:40px;
    border-radius:50%;
    background:#292929;
    color:white;
    font-size:17px;
}

.mainPlay{
    background:#00c853;
}

.progress{
    max-width:900px;
    margin:10px auto 0;
}

.progress input{
    width:100%;
}

.time{
    display:flex;
    justify-content:space-between;
    color:#999;
    font-size:11px;
}

.volume{
    width:100px;
}

@media(max-width:600px){
    .header h1{
        font-size:21px;
    }

    .searchBox{
        flex-direction:column;
    }

    .loadBtn{
        width:100%;
    }

    .volume{
        display:none;
    }

    .playerTop img{
        width:48px;
        height:48px;
    }
}
</style>
</head>

<body>

<div class="header">
    <h1>🎵 My Music</h1>
    <p>JioSaavn Playlist Player</p>
</div>

<div class="searchBox">
    <input
        id="playlistUrl"
        type="text"
        placeholder="Paste JioSaavn playlist URL..."
    >
    <button class="loadBtn" onclick="loadPlaylist()">
        Load Playlist
    </button>
</div>

<div class="container">

    <div id="status" class="status">
        Playlist URL paste karke Load Playlist dabayein
    </div>

    <div id="playlist"></div>

</div>

<div class="player">

    <div class="playerTop">

        <img
            id="nowImage"
            src="https://via.placeholder.com/100"
            alt="Album"
        >

        <div class="nowInfo">
            <div class="nowTitle" id="nowTitle">
                No Song Playing
            </div>

            <div class="nowArtist" id="nowArtist">
                —
            </div>
        </div>

        <div class="controls">

            <button class="control" onclick="previousSong()">⏮</button>

            <button
                class="control mainPlay"
                id="mainPlay"
                onclick="togglePlay()"
            >
                ▶
            </button>

            <button class="control" onclick="nextSong()">⏭</button>

            <button class="control" onclick="toggleShuffle()">🔀</button>

        </div>

        <input
            class="volume"
            type="range"
            min="0"
            max="1"
            step="0.01"
            value="1"
            onchange="audio.volume=this.value"
        >

    </div>

    <div class="progress">

        <input
            id="progress"
            type="range"
            min="0"
            max="100"
            value="0"
            oninput="seekSong(this.value)"
        >

        <div class="time">
            <span id="currentTime">0:00</span>
            <span id="duration">0:00</span>
        </div>

    </div>

</div>

<audio id="audio"></audio>

<script>

/* =========================================
   SETTINGS
========================================= */

const API_BASE =
    "https://saavnapi-nine.vercel.app";

/* =========================================
   VARIABLES
========================================= */

const audio = document.getElementById("audio");

let songs = [];
let currentIndex = -1;
let shuffle = false;


/* =========================================
   LOAD PLAYLIST
========================================= */

async function loadPlaylist(){

    const url =
        document.getElementById("playlistUrl").value.trim();

    if(!url){
        alert("JioSaavn playlist URL paste karein.");
        return;
    }

    const status =
        document.getElementById("status");

    status.innerText = "⏳ Playlist loading...";

    document.getElementById("playlist").innerHTML = "";

    try{

        const apiUrl =
            API_BASE +
            "/playlist/?query=" +
            encodeURIComponent(url);

        const response =
            await fetch(apiUrl);

        if(!response.ok){
            throw new Error("API Error");
        }

        const data =
            await response.json();

        /*
          Different unofficial APIs may return
          slightly different JSON structures.
        */

        songs =
            extractSongs(data);

        if(!songs.length){

            throw new Error(
                "Playlist me songs nahi mile."
            );

        }

        status.innerText =
            `🎵 ${songs.length} songs loaded`;

        renderPlaylist();

    }catch(error){

        console.error(error);

        status.innerHTML =
            "❌ Playlist load nahi hui.<br>" +
            "API temporarily unavailable ya playlist URL invalid ho sakta hai.";

    }

}


/* =========================================
   EXTRACT SONGS
========================================= */

function extractSongs(data){

    let list = [];

    if(Array.isArray(data)){
        list = data;
    }

    else if(Array.isArray(data.songs)){
        list = data.songs;
    }

    else if(data.data){

        if(Array.isArray(data.data)){
            list = data.data;
        }

        else if(Array.isArray(data.data.songs)){
            list = data.data.songs;
        }

    }

    return list
        .map(normalizeSong)
        .filter(song => song.title);

}


/* =========================================
   NORMALIZE SONG DATA
========================================= */

function normalizeSong(song){

    return {

        id:
            song.id ||
            song.songid ||
            song.songId ||
            "",

        title:
            song.title ||
            song.song ||
            song.name ||
            "Unknown Song",

        artist:
            song.singers ||
            song.artist ||
            song.primary_artists ||
            song.music ||
            "Unknown Artist",

        image:
            song.image_url ||
            song.image ||
            song.thumbnail ||
            "https://via.placeholder.com/300",

        url:
            song.url ||
            song.media_url ||
            song.download_url ||
            song.downloadUrl ||
            "",

        duration:
            song.duration || 0

    };

}


/* =========================================
   RENDER PLAYLIST
========================================= */

function renderPlaylist(){

    const container =
        document.getElementById("playlist");

    container.innerHTML = "";

    songs.forEach((song,index)=>{

        const div =
            document.createElement("div");

        div.className = "song";

        div.id =
            "song-" + index;

        div.innerHTML = `

            <img
                src="${escapeHtml(song.image)}"
                loading="lazy"
            >

            <div class="songInfo">

                <div class="songTitle">
                    ${escapeHtml(song.title)}
                </div>

                <div class="artist">
                    ${escapeHtml(song.artist)}
                </div>

            </div>

            <button
                class="playBtn"
                onclick="playSong(${index})"
            >
                ▶
            </button>

        `;

        container.appendChild(div);

    });

}


/* =========================================
   PLAY SONG
========================================= */

function playSong(index){

    if(!songs[index]){
        return;
    }

    currentIndex = index;

    const song =
        songs[index];

    if(!song.url){

        alert(
            "Is song ka playable audio URL API ne provide nahi kiya."
        );

        return;

    }

    audio.src = song.url;

    audio.play()
        .then(()=>{
            updatePlayer(song);
        })
        .catch(error=>{
            console.error(error);
            alert(
                "Song play nahi ho pa raha."
            );
        });

    updateActiveSong();

}


/* =========================================
   UPDATE PLAYER
========================================= */

function updatePlayer(song){

    document.getElementById("nowTitle")
        .innerText = song.title;

    document.getElementById("nowArtist")
        .innerText = song.artist;

    document.getElementById("nowImage")
        .src = song.image;

    document.getElementById("mainPlay")
        .innerText = "⏸";

}


/* =========================================
   ACTIVE SONG
========================================= */

function updateActiveSong(){

    document
        .querySelectorAll(".song")
        .forEach(el =>
            el.classList.remove("active")
        );

    const active =
        document.getElementById(
            "song-" + currentIndex
        );

    if(active){

        active.classList.add("active");

        active.scrollIntoView({
            behavior:"smooth",
            block:"center"
        });

    }

}


/* =========================================
   PLAY / PAUSE
========================================= */

function togglePlay(){

    if(!audio.src){

        if(songs.length){
            playSong(0);
        }

        return;
    }

    if(audio.paused){

        audio.play();

        document.getElementById(
            "mainPlay"
        ).innerText = "⏸";

    }else{

        audio.pause();

        document.getElementById(
            "mainPlay"
        ).innerText = "▶";

    }

}


/* =========================================
   NEXT
========================================= */

function nextSong(){

    if(!songs.length){
        return;
    }

    let next;

    if(shuffle){

        next =
            Math.floor(
                Math.random() * songs.length
            );

    }else{

        next =
            currentIndex + 1;

        if(next >= songs.length){
            next = 0;
        }

    }

    playSong(next);

}


/* =========================================
   PREVIOUS
========================================= */

function previousSong(){

    if(!songs.length){
        return;
    }

    let previous =
        currentIndex - 1;

    if(previous < 0){
        previous =
            songs.length - 1;
    }

    playSong(previous);

}


/* =========================================
   AUTO NEXT
========================================= */

audio.addEventListener(
    "ended",
    nextSong
);


/* =========================================
   PROGRESS
========================================= */

audio.addEventListener(
    "timeupdate",
    ()=>{

        if(!audio.duration){
            return;
        }

        const percentage =
            (audio.currentTime /
            audio.duration) * 100;

        document.getElementById(
            "progress"
        ).value = percentage;

        document.getElementById(
            "currentTime"
        ).innerText =
            formatTime(audio.currentTime);

        document.getElementById(
            "duration"
        ).innerText =
            formatTime(audio.duration);

    }
);


/* =========================================
   SEEK
========================================= */

function seekSong(value){

    if(!audio.duration){
        return;
    }

    audio.currentTime =
        (value / 100) *
        audio.duration;

}


/* =========================================
   SHUFFLE
========================================= */

function toggleShuffle(){

    shuffle = !shuffle;

    alert(
        shuffle
        ? "🔀 Shuffle ON"
        : "➡️ Shuffle OFF"
    );

}


/* =========================================
   FORMAT TIME
========================================= */

function formatTime(seconds){

    if(!seconds || isNaN(seconds)){
        return "0:00";
    }

    const min =
        Math.floor(seconds / 60);

    const sec =
        Math.floor(seconds % 60)
        .toString()
        .padStart(2,"0");

    return min + ":" + sec;

}


/* =========================================
   HTML ESCAPE
========================================= */

function escapeHtml(text){

    return String(text || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

</script>

</body>
</html>
