    const listContainer = document.getElementById('linkList');

    // Dynamically generating all 73 items
    linksData.forEach((item, index) => {
        const classNumber = index + 1;
        const li = document.createElement('li');
        li.className = 'item';
        li.innerHTML = `
            <input type="checkbox" class="link-checkbox" id="chk-${classNumber}" value="${item.url}" data-filename="Class ${classNumber}.mp4">
            <label for="chk-${classNumber}">
                <strong>Class ${classNumber}:</strong> ${item.name}
            </label>
        `;
        listContainer.appendChild(li);
    });

    // Select All / Deselect All Logic
    function toggleSelectAll(master) {
        const checkboxes = document.querySelectorAll('.link-checkbox');
        checkboxes.forEach(cb => cb.checked = master.checked);
    }

    // Download Logic with Delay (to bypass browser popup block)
    function downloadSelected() {
        const selected = document.querySelectorAll('.link-checkbox:checked');
        
        if (selected.length === 0) {
            alert('Kripya download karne ke liye kam se kam ek class select karein!');
            return;
        }

        selected.forEach((cb, i) => {
            setTimeout(() => {
                const a = document.createElement('a');
                a.href = cb.value;
                a.download = cb.getAttribute('data-filename'); // Class 1.mp4, Class 2.mp4 format
                a.target = '_blank';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            }, i * 1200); // 1.2 sec gap for smooth multiple downloads
        });
    }
